[package]
name = "terminal-v4-provider-connections"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
hex = "=0.4.3"
hmac = "=0.12.1"
libc = "=0.2.184"
rand = "=0.9.2"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
url = "2"
uuid = "1"
zeroize = "=1.8.2"

reqwest = { version = "=0.12.28", default-features = false, features = ["native-tls", "stream"] }
tokio = { version = "=1.51.0", features = ["rt", "net", "time", "sync", "macros"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }

[dev-dependencies]
tempfile = "=3.27.0"
