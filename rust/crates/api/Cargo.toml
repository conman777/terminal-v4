[package]
name = "terminal-v4-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.10"
async-trait.workspace = true
axum.workspace = true
axum-extra = { version = "0.10", features = ["multipart"] }
bcrypt.workspace = true
futures-util = "0.3"
hex.workspace = true
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
jsonwebtoken.workspace = true
native-tls.workspace = true
openssl = { version = "0.10", features = ["vendored"] }
portable-pty.workspace = true
rand = "0.9"
regex-lite = "0.1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
sysinfo = "0.33"
url = "2"
# webauthn-rs requires OpenSSL; enable on Linux deployment
# webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
# webauthn-rs-proto = "0.5"
postgres-native-tls.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
terminal-v4-core = { path = "../core" }
time.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
tokio-tungstenite = "0.28"
tokio-util = { version = "0.7", features = ["io"] }
tokio-postgres.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower.workspace = true
tower-http.workspace = true
uuid.workspace = true
webauthn-rs = { version = "0.5.4", features = ["danger-credential-internals"] }
zip = "2"

[dev-dependencies]
http-body-util.workspace = true
serde_json.workspace = true
tempfile = "3"
tower.workspace = true
