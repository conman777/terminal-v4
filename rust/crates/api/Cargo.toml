[package]
name = "terminal-v4-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
supervised-input-preview = []
queued-authority-preview = []
native-codex-queue-preview = ["queued-authority-preview"]

[dependencies]
base64 = "0.22"
aes-gcm = "0.10"
async-trait.workspace = true
axum.workspace = true
axum-extra = { version = "0.10", features = ["multipart"] }
bcrypt.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
futures-util = "0.3"
hex.workspace = true
html5ever = "0.29.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
jsonwebtoken.workspace = true
native-tls.workspace = true
openssl = { version = "0.10", features = ["vendored"] }
portable-pty.workspace = true
rand = "0.9"
regex-lite = "0.1"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
sysinfo = "0.33"
url = "2"
# webauthn-rs requires OpenSSL; enable on Linux deployment
# webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
# webauthn-rs-proto = "0.5"
postgres-native-tls.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
terminal-v4-core = { path = "../core" }
time.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-postgres.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower.workspace = true
tower-http.workspace = true
tempfile = "3"
uuid.workspace = true
webauthn-rs = { version = "0.5.4", features = ["danger-credential-internals"] }
zip = "2"

[target.'cfg(windows)'.dependencies]
conpty = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
terminal-v4-provider-connections = { path = "../provider-connections" }
libc = "0.2"

[dev-dependencies]
http-body-util.workspace = true
serde_json.workspace = true
tower.workspace = true
