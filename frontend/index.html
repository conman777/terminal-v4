<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon-idle.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>V4 Terminal</title>
    
    <!-- Fonts: Syne for brand, Space Grotesk for UI, JetBrains Mono for code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <script>
      // Lock the viewport before React mounts so iPhone focus zoom does not clip the shell.
      try {
        var ua = navigator.userAgent || '';
        var platform = navigator.platform || '';
        var touchCapableMac = platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1;
        var isIOSViewportZoomBrowser = /iPad|iPhone|iPod/i.test(ua) || touchCapableMac;
        if (isIOSViewportZoomBrowser) {
          var viewportMeta = document.querySelector('meta[name="viewport"]');
          if (viewportMeta) {
            var lockedViewportContent = (viewportMeta.getAttribute('content') || '')
              .split(',')
              .map(function(token) { return token.trim(); })
              .filter(Boolean)
              .filter(function(token) { return !/^maximum-scale=/i.test(token) && !/^user-scalable=/i.test(token); })
              .concat(['maximum-scale=1', 'user-scalable=no'])
              .join(', ');
            viewportMeta.setAttribute('content', lockedViewportContent);
          }
        }
      } catch (e) {}
    </script>
    <script>
      // Apply saved theme before first paint to prevent flash
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
